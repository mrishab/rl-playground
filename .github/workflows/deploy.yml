name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm rebuild rollup

      - name: Build
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Run Cypress E2E Tests
        run: |
          npx vite preview --port 3000 --host 127.0.0.1 &
          for i in {1..30}; do curl -sI http://127.0.0.1:3000/RL-Playground/ && break || sleep 1; done
          npx cypress run --config baseUrl=http://127.0.0.1:3000/RL-Playground

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
